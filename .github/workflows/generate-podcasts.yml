name: Generate Podcast Audio

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Single article slug to generate (leave empty to generate all)'
        required: false
        type: string
      skip_existing:
        description: 'Skip slugs that already have a generated URL'
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'public/podcasts/**.json'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Generate podcast audio
        env:
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            node scripts/generate-podcasts.mjs "${{ inputs.slug }}"
          elif [ "${{ inputs.skip_existing }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            node scripts/generate-podcasts.mjs --skip-existing
          else
            node scripts/generate-podcasts.mjs
          fi

      - name: Commit updated URL map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/podcast-audio-urls.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add pre-generated podcast audio URLs"
            git push
          fi
